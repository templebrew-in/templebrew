[build]
  publish = "."

[[redirects]]
  from = "http://templebrew.in/*"
  to = "https://templebrew.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.templebrew.in/*"
  to = "https://templebrew.in/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

