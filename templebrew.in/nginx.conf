# Nginx Server Configuration for templebrew.in
server {
    listen 80;
    listen [::]:80;
    server_name templebrew.in www.templebrew.in;
    return 301 https://templebrew.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name templebrew.in;

    root /var/www/templebrew.in;
    index index.html;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/templebrew.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/templebrew.in/privkey.pem;

    # GZIP Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Long-term Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

